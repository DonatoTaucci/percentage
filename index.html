<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Registra turni di lavoro e pause, calcola la percentuale di ore lavorate giornaliera, settimanale e mensile, tiene conto degli straordinari e include un assistente per la prevenzione di burnout, stress e ansia da lavoro.">
<title>Percentage — Turni, ore e benessere</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Percentage">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">%</span>
      <div>
        <h1>Percentage</h1>
        <p id="topbar-sub">Turni, ore e benessere</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-theme" class="icon-btn" type="button" title="Cambia tema" aria-label="Cambia tema">◐</button>
      <button id="btn-install" class="icon-btn hidden" type="button" title="Installa l'app" aria-label="Installa l'app">⤓</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="dashboard" role="tab" aria-label="Oggi">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17" class="fill"/></svg><span>Oggi</span></button>
    <button class="tab" data-view="turni" role="tab" aria-label="Turni">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3.5M16 3v3.5M7.5 13h4M7.5 16.5h7"/></svg><span>Turni</span></button>
    <button class="tab" data-view="statistiche" role="tab" aria-label="Statistiche">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V13M9.3 20V6M14.7 20v-9M20 20V9"/></svg><span>Statistiche</span></button>
    <button class="tab" data-view="benessere" role="tab" aria-label="Benessere">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 6.7a4.6 4.6 0 0 0-6.6 0L12 8.4l-1.7-1.7a4.6 4.6 0 1 0-6.6 6.5l8.3 8.3 8.3-8.3a4.6 4.6 0 0 0 0-6.5Z"/></svg><span>Benessere</span></button>
    <button class="tab" data-view="impostazioni" role="tab" aria-label="Impostazioni">
      <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5M12.5 7H21M3 12.5h11M18 12.5h3M3 18h6M13.5 18H21"/><circle cx="10" cy="7" r="2.2"/><circle cx="16" cy="12.5" r="2.2"/><circle cx="11.5" cy="18" r="2.2"/></svg><span>Impostazioni</span></button>
  </nav>

  <main id="main"></main>

  <footer class="foot">
    <span>I dati restano sul tuo dispositivo.</span>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="clerk-modal" class="modal">
  <div id="clerk-slot"></div>
  <div style="padding:0 20px 20px"><button class="btn block" data-action="close-clerk">Chiudi</button></div>
</dialog>

<dialog id="modal" class="modal">
  <form method="dialog" id="modal-body"></form>
</dialog>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/coach.js"></script>
<script src="js/geo.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/cloud.js"></script>
</body>
</html>
